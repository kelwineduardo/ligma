<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade - Número de Sílabas</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .grade {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 500px;
            margin: auto;
        }

        .item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .imagem {
            width: 120px;
            height: 120px;
            border: 2px dashed gray;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 10px;
        }

        input {
            width: 50px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>nome</h1> <input type="text" placeholder="Digite seu nome"><br><br></h1>
    data: <input type="date"><br><br>

    <h1>Quantas Sílabas?</h1>
    <p>Observe as imagens e escreva o número de sílabas.</p>

    <div class="grade">
        <div class="item"><div class="imagem"></div><input type="number"></div>
        <div class="item"><div class="imagem">Imagem 2</div><input type="number"></div>
        <div class="item"><div class="imagem">Imagem 3</div><input type="number"></div>

        <div class="item"><div class="imagem">Imagem 4</div><input type="number"></div>
        <div class="item"><div class="imagem">Imagem 5</div><input type="number"></div>
        <div class="item"><div class="imagem">Imagem 6</div><input type="number"></div>

        <div class="item"><div class="imagem">Imagem 7</div><input type="number"></div>
        <div class="item"><div class="imagem">Imagem 8</div><input type="number"></div>
        <div class="item"><div class="imagem">Imagem 9</div><input type="number"></div>
    </div>

    <br>
    <button>Enviar</button>

</body>
</html>
